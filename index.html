<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccesibleReader - Diseño Lateral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #fffdf5;
            --text-main: #2d2d2d;
            --letter-spacing: 0px;
            --line-height: 1.6;
            --image-width: 40%; /* Ancho base para la columna de imagen */
            --green-dot-size: 8px;
        }

        body {
            background-color: #f0f2f5;
            color: #1a1a1a;
            transition: all 0.2s ease;
            overflow-x: hidden;
        }

        #reader-container {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            letter-spacing: var(--letter-spacing);
            line-height: var(--line-height);
            transition: background-color 0.4s, color 0.4s;
            position: relative;
        }

        .font-roboto { font-family: 'Roboto', sans-serif; }
        .font-arial { font-family: Arial, Helvetica, sans-serif; }
        .font-sans { font-family: ui-sans-serif, system-ui, sans-serif; }

        #reading-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            pointer-events: none;
            display: none;
            z-index: 999;
            clip-path: polygon(0% 0%, 0% 100%, 100% 100%, 100% 0%, 0% 0%, 0% 48%, 100% 48%, 100% 52%, 0% 52%, 0% 48%);
        }

        /* Estilo para los inputs range */
        input[type=range] {
            height: 6px;
            -webkit-appearance: none;
            background: #cbd5e1;
            border-radius: 5px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }

        /* Contenedor de fila con imagen a la izquierda */
        .story-row {
            display: flex;
            align-items: flex-start;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .image-column {
            flex: 0 0 var(--image-width);
            max-width: var(--image-width);
        }

        .text-column {
            flex: 1;
        }

        .story-image {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: all 0.3s ease;
        }

        /* Botones de paleta */
        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-dot:hover { transform: scale(1.1); }

        @media (max-width: 768px) {
            .story-row {
                flex-direction: column;
            }
            .image-column {
                max-width: 100%;
                width: 100%;
            }
        }

        .recording-pulse {
            animation: pulse 1.5s infinite;
        }

        .red-dots-mark, .green-dots-mark {
            position: relative;
            display: inline-block;
            padding: 2px;
        }
        .red-dots-mark .dot {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #ff0000;
        }
        .green-dots-mark .dot {
            position: absolute;
            width: var(--green-dot-size);
            height: var(--green-dot-size);
            border-radius: 50%;
            background-color: #00ff00;
            left: calc(var(--green-dot-size) * -1.5);
            top: 50%;
            transform: translateY(-50%);
        }

        .green-dot-left {
            position: relative;
            display: inline-block;
            padding: 2px;
        }
        .green-dot-left::before {
            content: '';
            position: absolute;
            width: var(--green-dot-size);
            height: var(--green-dot-size);
            border-radius: 50%;
            background-color: #00ff00;
            left: calc(var(--green-dot-size) * -2);
            top: 50%;
            transform: translateY(-50%);
        }
        
        .dot-tl { top: 0; left: 0; }
        .dot-tr { top: 0; right: 0; }
        .dot-bl { bottom: 0; left: 0; }
        .dot-br { bottom: 0; right: 0; }

        .underline-mark {
            text-decoration: underline;
            text-decoration-color: #ff0000;
            text-decoration-thickness: 2px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="font-sans min-h-screen">

    <div id="reading-mask"></div>

    <aside class="fixed left-0 top-0 h-full w-72 bg-white shadow-2xl p-6 z-[1000] overflow-y-auto hidden md:block border-r border-gray-100">
        <h2 class="text-xl font-bold mb-6 flex items-center gap-2 border-b pb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
            Herramientas
        </h2>

        <div class="mb-8 space-y-2">
            <label class="block text-sm font-semibold text-gray-600">Cargar Cuento (JSON)</label>
            <input type="file" id="jsonInput" accept=".json" class="hidden">
            <button onclick="document.getElementById('jsonInput').click()" class="w-full bg-slate-800 text-white py-2 rounded hover:bg-slate-700 transition flex justify-center items-center gap-2 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                <span>Subir Cuento</span>
            </button>
        </div>

        <div class="mb-8">
            <label class="block text-sm font-semibold mb-3 text-gray-700">Paleta de Fondo</label>
            <div class="flex flex-wrap gap-3">
                <button onclick="setTheme('#fffdf5', '#2d2d2d')" class="color-dot" style="background-color: #fffdf5;" title="Crema"></button>
                <button onclick="setTheme('#ffffff', '#1a1a1a')" class="color-dot" style="background-color: #ffffff;" title="Blanco"></button>
                <button onclick="setTheme('#f4f4f4', '#333333')" class="color-dot" style="background-color: #f4f4f4;" title="Gris"></button>
                <button onclick="setTheme('#e8effd', '#1a2b4b')" class="color-dot" style="background-color: #e8effd;" title="Azul"></button>
                <button onclick="setTheme('#2d2d2d', '#f4f4f4')" class="color-dot" style="background-color: #2d2d2d;" title="Oscuro"></button>
                <button onclick="setTheme('#000000', '#00ff00')" class="color-dot" style="background-color: #000000; border: 1px solid #00ff00;" title="Alto Contraste"></button>
            </div>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700">Tipo de Letra</label>
                <select id="fontFamily" onchange="updateStyle('fontFamily', this.value)" class="w-full p-2 border rounded bg-gray-50 focus:ring-2 focus:ring-blue-200 outline-none">
                    <option value="font-sans">Sans Serif</option>
                    <option value="font-roboto">Roboto</option>
                    <option value="font-arial">Arial</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">Tamaño Letra: <span id="sizeVal" class="text-blue-600">20</span>px</label>
                <input type="range" id="fontSizeRange" min="14" max="60" value="20" class="w-full" oninput="updateStyle('fontSize', this.value)">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">Interletra: <span id="letterVal" class="text-blue-600">0</span>px</label>
                <input type="range" id="letterSpacingRange" min="0" max="10" step="0.5" value="0" class="w-full" oninput="updateStyle('letterSpacing', this.value)">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">Interlineado: <span id="lineHeightVal" class="text-blue-600">1.6</span></label>
                <input type="range" id="lineHeightRange" min="1" max="3" step="0.1" value="1.6" class="w-full" oninput="updateStyle('lineHeight', this.value)">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">Columna Imagen: <span id="imgSizeVal" class="text-blue-600">40</span>%</label>
                <input type="range" id="imageSizeRange" min="10" max="70" value="40" class="w-full accent-emerald-500" oninput="updateStyle('imageWidth', this.value)">
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-200">
            <button id="btnGuide" onclick="toggleGuide()" class="w-full mb-6 flex items-center justify-between p-3 bg-slate-100 rounded hover:bg-slate-200 transition border border-transparent shadow-sm">
                <span class="flex items-center gap-2 font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg> 
                    Foco Renglón
                </span>
                <span class="text-[10px] bg-white px-2 py-0.5 rounded border text-gray-500 shadow-xs">ESC</span>
            </button>

            <div class="space-y-4 bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                <label class="block text-xs font-bold text-emerald-800 uppercase text-center">Laboratorio de Audio</label>
                
                <div class="space-y-2">
                    <label class="block text-[10px] font-bold text-emerald-700 mb-1">Audio del Cuento</label>
                    <input type="file" id="storyAudioInput" accept="audio/*" class="hidden" onchange="loadStoryAudio(this)">
                    <button onclick="document.getElementById('storyAudioInput').click()" class="w-full bg-emerald-600 text-white py-3 rounded-lg text-xs flex items-center justify-center gap-2 hover:bg-emerald-700 transition shadow-sm font-bold uppercase tracking-wider">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                        Subir Audio del Cuento
                    </button>
                    <div id="storyAudioControl" class="hidden flex items-center gap-2 p-2 bg-white rounded border border-emerald-200">
                        <button id="storyPlayBtn" onclick="playStoryAudio()" class="bg-emerald-100 text-emerald-700 p-2 rounded-full hover:bg-emerald-200">▶</button>
                        <span class="text-[9px] text-emerald-800 truncate flex-1" id="storyAudioName">Cuento.mp3</span>
                        <audio id="storyAudioPlayer"></audio>
                    </div>
                </div>

                <div class="pt-2 border-t border-emerald-200 space-y-2">
                    <label class="block text-[10px] font-bold text-emerald-700 mb-1">Tu propia voz</label>
                    <button id="btnRecord" onclick="toggleRecording()" class="w-full bg-red-500 text-white py-2 rounded-lg text-[10px] uppercase font-bold tracking-widest transition-all">
                        <span id="recordText">Grabar Voz</span>
                    </button>
                    <div id="recordingResult" class="hidden mt-2 flex items-center gap-2 p-2 bg-white rounded border border-red-200">
                        <button onclick="playRecordedAudio()" class="bg-red-100 text-red-700 p-1.5 rounded">▶</button>
                        <span class="text-[9px] text-red-800 flex-1">Grabación</span>
                        <button onclick="downloadRecording()" class="bg-blue-500 text-white p-1.5 rounded hover:bg-blue-600 transition" title="Descargar grabación">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        </button>
                        <audio id="recordedAudioPlayer" class="hidden"></audio>
                    </div>
                </div>
            </div>

            <div class="mt-6 bg-blue-50 p-4 rounded-xl border border-blue-100">
                <label class="block text-xs font-bold text-blue-800 uppercase text-center mb-3">Voz del Sistema</label>
                <div class="flex gap-2">
                    <button onclick="speakText()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition shadow-sm">Leer Todo</button>
                    <button onclick="stopSpeech()" class="bg-red-500 text-white px-3 py-2 rounded-lg hover:bg-red-600">■</button>
                </div>
            </div>

            <div class="mt-6 bg-purple-50 p-4 rounded-xl border border-purple-100">
                <label class="block text-xs font-bold text-purple-800 uppercase text-center mb-3">Edición de Texto</label>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <button onclick="applyUnderline()" class="bg-purple-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-purple-700 transition shadow-sm">Subrayar</button>
                    <button onclick="applyRedDots()" class="bg-purple-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-purple-700 transition shadow-sm">4 Puntos R.</button>
                    <button onclick="applyGreenDotLeft()" class="bg-purple-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-purple-700 transition shadow-sm col-span-2">• Punto Izquierda</button>
                </div>
                
                <div class="mb-4">
                    <label class="block text-[10px] font-bold text-purple-700 mb-1 uppercase tracking-tight">Tamaño Punto Verde: <span id="greenDotSizeVal" class="text-purple-600">8</span>px</label>
                    <input type="range" id="greenDotSizeRange" min="4" max="30" value="8" class="w-full accent-purple-500" oninput="updateStyle('greenDotSize', this.value)">
                </div>

                <button onclick="clearMarks()" class="w-full mb-3 bg-red-100 text-red-700 py-2 rounded-lg text-xs font-bold hover:bg-red-200 transition flex justify-center items-center gap-2 border border-red-200">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Quitar Marcas
                </button>
                <button onclick="saveChanges()" class="w-full bg-slate-800 text-white py-2 rounded-lg text-sm font-bold hover:bg-slate-900 transition flex justify-center items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    Guardar Cambios
                </button>
            </div>
        </div>
    </aside>

    <main class="md:ml-72 p-4 md:p-12 transition-all">
        <div id="reader-container" class="max-w-5xl mx-auto min-h-[85vh] p-8 md:p-16 rounded-lg shadow-sm border border-gray-100">
            <div id="placeholder" class="text-center py-24 opacity-60">
                <h3 class="text-2xl font-bold mb-2">Carga tu Cuento</h3>
                <p>Usa el botón superior para subir el archivo JSON.</p>
            </div>
            <article id="readable-content" class="hidden"></article>
        </div>
    </main>

    <script>
        let isGuideActive = false;
        let synthesis = window.speechSynthesis;
        let currentUtterance = null;
        let mediaRecorder;
        let audioChunks = [];

        const reader = document.getElementById('reader-container');
        const content = document.getElementById('readable-content');
        const mask = document.getElementById('reading-mask');

        function setTheme(bg, text) {
            document.documentElement.style.setProperty('--bg-canvas', bg);
            document.documentElement.style.setProperty('--text-main', text);
            reader.style.borderColor = (bg === '#000000' || bg === '#2d2d2d') ? '#444' : '#f1f1f1';
        }

        function updateStyle(prop, value) {
            const selection = window.getSelection();
            const hasSelection = selection.rangeCount && !selection.isCollapsed;

            if(prop === 'fontSize') {
                document.getElementById('sizeVal').innerText = value;
                document.getElementById('fontSizeRange').value = value;
                
                if (hasSelection) {
                    applyStyleToSelection(prop, value + 'px');
                } else {
                    reader.style.fontSize = value + 'px';
                }
            } else if(prop === 'fontFamily') {
                reader.classList.remove('font-roboto', 'font-arial', 'font-sans');
                if(value.toLowerCase().includes('arial')) reader.classList.add('font-arial');
                else if(value.toLowerCase().includes('roboto')) reader.classList.add('font-roboto');
                else reader.classList.add('font-sans');
                
                if (hasSelection) {
                    let fontValue = 'ui-sans-serif, system-ui, sans-serif';
                    if(value.toLowerCase().includes('arial')) fontValue = 'Arial, Helvetica, sans-serif';
                    else if(value.toLowerCase().includes('roboto')) fontValue = 'Roboto, sans-serif';
                    applyStyleToSelection('fontFamily', fontValue);
                }
            } else if(prop === 'imageWidth') {
                document.documentElement.style.setProperty('--image-width', value + '%');
                document.getElementById('imgSizeVal').innerText = value;
                document.getElementById('imageSizeRange').value = value;
            } else if(prop === 'letterSpacing') {
                document.getElementById('letterVal').innerText = value;
                
                if (hasSelection) {
                    applyStyleToSelection(prop, value + 'px');
                } else {
                    reader.style.letterSpacing = value + 'px';
                }
            } else if(prop === 'lineHeight') {
                document.getElementById('lineHeightVal').innerText = value;
                
                if (hasSelection) {
                    applyStyleToSelection(prop, value);
                } else {
                    reader.style.lineHeight = value;
                }            } else if(prop === 'greenDotSize') {
                document.documentElement.style.setProperty('--green-dot-size', value + 'px');
                document.getElementById('greenDotSizeVal').innerText = value;
                document.getElementById('greenDotSizeRange').value = value;            }
        }

        function applyStyleToSelection(property, value) {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;
            
            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            
            // Aplicar estilos según la propiedad
            if (property === 'fontSize') {
                span.style.fontSize = value;
            } else if (property === 'fontFamily') {
                span.style.fontFamily = value;
            } else if (property === 'letterSpacing') {
                span.style.letterSpacing = value;
            } else if (property === 'lineHeight') {
                span.style.lineHeight = value;
            }
            
            try {
                const content = range.extractContents();
                span.appendChild(content);
                range.insertNode(span);
            } catch (e) {
                alert("La selección es demasiado compleja. Intenta seleccionar texto dentro de un mismo párrafo.");
            }
        }

        // --- MANEJO DE JSON ---
        document.getElementById('jsonInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const fReader = new FileReader();
            fReader.onload = (ev) => {
                try {
                    processStoryJSON(JSON.parse(ev.target.result));
                } catch(e) { alert("Error al procesar el archivo."); }
            };
            fReader.readAsText(file);
        });

        function processStoryJSON(data) {
            document.getElementById('placeholder').classList.add('hidden');
            content.classList.remove('hidden');

            if(data.styles) {
                if(data.styles.fontSize) updateStyle('fontSize', parseInt(data.styles.fontSize));
                if(data.styles.fontFamily) updateStyle('fontFamily', data.styles.fontFamily);
            }

            let html = "";
            if(data.title) html += `<h1 class="text-4xl font-bold mb-16 border-b pb-8">${data.title}</h1>`;
            
            if(data.rows && Array.isArray(data.rows)) {
                data.rows.forEach(row => {
                    html += `
                        <div class="story-row">
                            ${row.image ? `
                                <div class="image-column">
                                    <img src="${row.image}" class="story-image" alt="Ilustración">
                                </div>
                            ` : ''}
                            <div class="text-column">
                                <p>${row.text || ''}</p>
                            </div>
                        </div>
                    `;
                });
            }
            
            content.innerHTML = html;
        }

        // --- AUDIO DEL CUENTO ---
        function loadStoryAudio(input) {
            const file = input.files[0];
            if (file) {
                const player = document.getElementById('storyAudioPlayer');
                player.src = URL.createObjectURL(file);
                document.getElementById('storyAudioName').innerText = file.name;
                document.getElementById('storyAudioControl').classList.remove('hidden');
            }
        }

        function playStoryAudio() {
            const p = document.getElementById('storyAudioPlayer');
            const btn = document.getElementById('storyPlayBtn');
            if(p.paused) {
                p.play();
                btn.innerText = "||";
            } else {
                p.pause();
                btn.innerText = "▶";
            }
            p.onended = () => btn.innerText = "▶";
        }

        // --- GRABACIÓN Y VOZ SISTEMA ---
        async function toggleRecording() {
            const btn = document.getElementById('btnRecord');
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/wav' });
                        const audioUrl = URL.createObjectURL(blob);
                        document.getElementById('recordedAudioPlayer').src = audioUrl;
                        document.getElementById('recordingResult').classList.remove('hidden');
                    };
                    mediaRecorder.start();
                    btn.classList.add('recording-pulse', 'bg-red-700');
                    document.getElementById('recordText').innerText = "DETENER";
                } catch (e) { alert("Micrófono no detectado."); }
            } else {
                mediaRecorder.stop();
                btn.classList.remove('recording-pulse', 'bg-red-700');
                document.getElementById('recordText').innerText = "GRABAR VOZ";
            }
        }

        function playRecordedAudio() {
            const p = document.getElementById('recordedAudioPlayer');
            p.paused ? p.play() : p.pause();
        }

        function downloadRecording() {
            const player = document.getElementById('recordedAudioPlayer');
            if (player.src) {
                const link = document.createElement('a');
                link.href = player.src;
                link.download = 'mi_grabacion.wav';
                link.click();
            }
        }

        function speakText() {
            synthesis.cancel();
            const text = content.innerText;
            if(!text) return;
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = 'es-ES';
            synthesis.speak(currentUtterance);
        }

        function stopSpeech() { synthesis.cancel(); }

        // --- REGLA DE LECTURA ---
        function toggleGuide() {
            isGuideActive = !isGuideActive;
            mask.style.display = isGuideActive ? 'block' : 'none';
        }

        window.addEventListener('mousemove', e => {
            if (isGuideActive) {
                const y = e.clientY, h = window.innerHeight, fh = 60;
                const t = ((y - (fh / 2)) / h) * 100, b = ((y + (fh / 2)) / h) * 100;
                mask.style.clipPath = `polygon(0% 0%, 0% 100%, 100% 100%, 100% 0%, 0% 0%, 0% ${t}%, 100% ${t}%, 100% ${b}%, 0% ${b}%, 0% ${t}%)`;
            }
        });
        window.addEventListener('keydown', e => { if (e.key === "Escape" && isGuideActive) toggleGuide(); });

        // --- EDICIÓN DE TEXTO ---
        function applyUnderline() {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;
            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.className = 'underline-mark';
            try {
                range.surroundContents(span);
            } catch (e) {
                alert("La selección es demasiado compleja. Intenta seleccionar texto dentro de un mismo párrafo.");
            }
        }

        function applyRedDots() {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;
            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.className = 'red-dots-mark';
            
            try {
                const content = range.extractContents();
                span.appendChild(content);
                
                ['tl', 'tr', 'bl', 'br'].forEach(pos => {
                    const dot = document.createElement('span');
                    dot.className = `dot dot-${pos}`;
                    span.appendChild(dot);
                });
                
                range.insertNode(span);
            } catch (e) {
                alert("La selección es demasiado compleja.");
            }
        }

        function applyGreenDot() {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;
            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.className = 'green-dots-mark';
            
            try {
                const content = range.extractContents();
                span.appendChild(content);
                
                ['tl', 'tr', 'bl', 'br'].forEach(pos => {
                    const dot = document.createElement('span');
                    dot.className = `dot dot-${pos}`;
                    span.appendChild(dot);
                });
                
                range.insertNode(span);
            } catch (e) {
                alert("La selección es demasiado compleja.");
            }
        }

        function applyGreenDotLeft() {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;
            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.className = 'green-dot-left';
            
            try {
                const content = range.extractContents();
                span.appendChild(content);
                range.insertNode(span);
            } catch (e) {
                alert("La selección es demasiado compleja.");
            }
        }

        function clearMarks() {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) {
                alert("Por favor, selecciona el texto del que quieras quitar las marcas.");
                return;
            }

            const range = selection.getRangeAt(0);
            const container = range.commonAncestorContainer;
            const parentElement = container.nodeType === 1 ? container : container.parentElement;

            // Buscamos elementos con nuestras clases dentro o siendo padres de la selección
            const marks = parentElement.querySelectorAll('.underline-mark, .red-dots-mark, .green-dots-mark');
            
            let found = false;
            marks.forEach(mark => {
                if (selection.containsNode(mark, true)) {
                    const text = mark.innerText;
                    mark.replaceWith(text);
                    found = true;
                }
            });

            // Si no encontramos dentro, quizás la selección está dentro de una marca
            if (!found) {
                const closestMark = parentElement.closest('.underline-mark, .red-dots-mark, .green-dots-mark');
                if (closestMark) {
                    const text = closestMark.innerText;
                    closestMark.replaceWith(text);
                    found = true;
                }
            }

            if (!found) {
                alert("No se encontraron marcas en la selección.");
            }
        }

        function saveChanges() {
            const rows = document.querySelectorAll('.story-row');
            const data = {
                title: document.querySelector('h1')?.innerText || '',
                styles: {
                    fontSize: reader.style.fontSize,
                    fontFamily: reader.classList.contains('font-roboto') ? 'font-roboto' : 
                               reader.classList.contains('font-arial') ? 'font-arial' : 'font-sans'
                },
                rows: []
            };

            rows.forEach(row => {
                const img = row.querySelector('.story-image');
                const p = row.querySelector('.text-column p');
                data.rows.push({
                    image: img ? img.src : null,
                    text: p ? p.innerHTML : ""
                });
            });

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cuento_editado.json';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
